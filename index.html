<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晨间窗</title>
<style>
  /* reTerminal E1002 · E Ink Spectra 6（只用六个纯色，无渐变无中间色）
     全部尺寸用 --u 换算 = 组件框宽度的 1%（并按框高钳制），随框等比缩放 */
  :root {
    --u: min(1vw, 1.6667vh);
    --ink-black: #1a1a1a;
    --ink-white: #f7f5ef;
    --ink-red:   #c0392b;
    --ink-yellow:#e6b800;
    --ink-blue:  #2e5f8a;
    --ink-green: #3d7a52;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:var(--ink-white);
    color:var(--ink-black);
    font-family:"Noto Serif SC","Songti SC","SimSun",serif;
    font-weight:700;
  }
  .frame {
    width:100%; height:100%;
    border:calc(var(--u)*0.8) solid var(--ink-black);
    display:flex;
  }

  /* ===== 左栏 ===== */
  .left {
    width:29.5%;
    border-right:calc(var(--u)*0.5) solid var(--ink-black);
    display:flex; flex-direction:column; align-items:center;
    padding:calc(var(--u)*2.4) 0 calc(var(--u)*1.8) 0;
  }
  .px-sun   { width:calc(var(--u)*13); height:calc(var(--u)*11); }
  .px-flower{ width:calc(var(--u)*4.4); height:calc(var(--u)*5); margin:0 calc(var(--u)*1); }
  .px-waves { width:calc(var(--u)*18.5); height:calc(var(--u)*2.1); }
  .px-cup   { width:calc(var(--u)*11); height:calc(var(--u)*11); }
  .px-gua   { width:calc(var(--u)*9); height:calc(var(--u)*9.8); }

  .month-day { font-size:calc(var(--u)*5.6); margin-top:calc(var(--u)*2.2); letter-spacing:1px; }
  .weekday   { font-size:calc(var(--u)*2.7); color:var(--ink-blue); letter-spacing:calc(var(--u)*0.7); margin-top:calc(var(--u)*0.6); }
  .divider   { width:62%; border-top:calc(var(--u)*0.35) dashed var(--ink-black); margin:calc(var(--u)*1.9) 0; }
  .weather   { font-size:calc(var(--u)*2.35); color:var(--ink-green); letter-spacing:calc(var(--u)*0.25); text-align:center; line-height:1.7; }
  .flowers   { margin-top:auto; display:flex; align-items:flex-end; }
  .waves     { margin-top:calc(var(--u)*1.1); }

  /* ===== 右栏 ===== */
  .right {
    flex:1; display:flex; flex-direction:column;
    padding:calc(var(--u)*2.6) calc(var(--u)*3.4);
  }
  .head { display:flex; align-items:flex-start; justify-content:space-between; }
  .head-left { padding-top:calc(var(--u)*0.8); }
  .head-title { font-size:calc(var(--u)*3.4); color:var(--ink-red); letter-spacing:calc(var(--u)*0.5); }
  .head-sub   { font-size:calc(var(--u)*2.3); letter-spacing:calc(var(--u)*0.25); margin-top:calc(var(--u)*1.3); }
  .gua { display:flex; flex-direction:column; align-items:center; }
  .gua-name { font-size:calc(var(--u)*2.1); color:var(--ink-red); letter-spacing:calc(var(--u)*0.5); margin-top:calc(var(--u)*0.7); }

  .letter { flex:1; display:flex; align-items:center; gap:calc(var(--u)*1.6); }
  .letter-body { flex:1; font-size:calc(var(--u)*3.25); line-height:1.75; letter-spacing:1px; }
  .letter-body em { font-style:normal; color:var(--ink-blue); }

  .practice { border-top:calc(var(--u)*0.35) dashed var(--ink-black); padding-top:calc(var(--u)*1.4); display:flex; align-items:center; }
  .practice-tag {
    background:var(--ink-green); color:var(--ink-white);
    font-size:calc(var(--u)*2.05); letter-spacing:calc(var(--u)*0.35);
    padding:calc(var(--u)*0.6) calc(var(--u)*1.3); margin-right:calc(var(--u)*1.6); white-space:nowrap;
  }
  .practice-text { font-size:calc(var(--u)*2.45); line-height:1.5; }
</style>
</head>
