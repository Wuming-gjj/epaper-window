<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字卡</title>
<style>
  /* 小区域字卡 · reTerminal E1002 Spectra 6
     全部尺寸 = --u = min(1vw,1vh)，随组件框等比缩放，怎么缩都不糊不裁 */
  :root{
    --u: min(1vw, 1vh);
    --paper:#f7f5ef; --ink:#1a1a1a; --seal:#c0392b;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:"Kaiti SC","STKaiti","KaiTi","AR PL KaitiM GB","Noto Serif CJK SC","Songti SC",serif;
    font-weight:700; color:var(--ink);
  }

  .card{
    position:relative;
    width:96%; height:92%;
    border:calc(var(--u)*0.9) solid var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  /* 双线框：内细线 */
  .card::after{
    content:""; position:absolute;
    inset:calc(var(--u)*2.2);
    border:calc(var(--u)*0.35) solid var(--ink);
  }

  .words{
    font-size:calc(var(--u)*15.5);
    line-height:1.62;
    letter-spacing:calc(var(--u)*1.2);
    text-align:center;
  }

  /* 红色小印章 */
  .seal{
    position:absolute;
    top:calc(var(--u)*6); right:calc(var(--u)*6);
    width:calc(var(--u)*9.5); height:calc(var(--u)*9.5);
    background:var(--seal); color:var(--paper);
    font-size:calc(var(--u)*5.6); line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="seal">蓄</div>
    <div class="words">先蓄后通<br>水满自溢</div>
  </div>
</body>
</html>
