<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1">
<title>晨间窗 · 给无名</title>
<style>
  /* reTerminal E1002: 800x480, E Ink Spectra 6 —— 只用六个纯墨色，禁用渐变与中间色 */
  :root {
    --ink-black: #1a1a1a;
    --ink-white: #f7f5ef;
    --ink-red:   #c0392b;
    --ink-yellow:#e6b800;
    --ink-blue:  #2e5f8a;
    --ink-green: #3d7a52;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 800px; height: 480px;
    overflow: hidden;
    background: var(--ink-white);
    color: var(--ink-black);
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-weight: 700;
  }
  .frame {
    width: 800px; height: 480px;
    border: 6px solid var(--ink-black);
    display: flex;
    position: relative;
  }

  /* ===== 左栏：日期与太阳 ===== */
  .left {
    width: 240px;
    border-right: 4px solid var(--ink-black);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 42px;
  }
  .sun {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: var(--ink-yellow);
    border: 5px solid var(--ink-black);
    margin-bottom: 34px;
  }
  .month-day {
    font-size: 44px;
    letter-spacing: 2px;
  }
  .weekday {
    font-size: 24px;
    color: var(--ink-blue);
    margin-top: 10px;
    letter-spacing: 6px;
  }
  .weather {
    margin-top: 34px;
    font-size: 20px;
    color: var(--ink-green);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.8;
  }

  /* ===== 右栏：信与练习 ===== */
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .letter {
    flex: 1;
    padding: 40px 40px 24px 40px;
  }
  .letter-title {
    font-size: 22px;
    color: var(--ink-red);
    letter-spacing: 4px;
    margin-bottom: 16px;
  }
  .letter-body {
    font-size: 26px;
    line-height: 1.85;
    letter-spacing: 1px;
  }
  .letter-body em {
    font-style: normal;
    color: var(--ink-blue);
  }

  /* 底部：聚焦练习条 */
  .practice {
    border-top: 4px dashed var(--ink-black);
    margin: 0 28px;
    padding: 16px 12px 14px 12px;
    display: flex;
    align-items: center;
  }
  .practice-tag {
    background: var(--ink-green);
    color: var(--ink-white);
    font-size: 18px;
    letter-spacing: 3px;
    padding: 6px 14px;
    margin-right: 18px;
    white-space: nowrap;
  }
  .practice-text {
    font-size: 21px;
    line-height: 1.6;
  }

  /* 落款 */
  .signature {
    position: absolute;
    right: 40px;
    top: 46px;
    font-size: 20px;
    color: var(--ink-black);
    letter-spacing: 2px;
  }

  /* 海浪：三条蓝色波浪 */
  .waves {
    position: absolute;
    left: 0; bottom: 0;
    width: 240px; height: 60px;
  }
  .wave {
    position: absolute;
    left: 0;
    width: 100%;
    height: 10px;
    background: var(--ink-blue);
    border-radius: 5px;
  }
  .wave:nth-child(1) { bottom: 12px; width: 78%; }
  .wave:nth-child(2) { bottom: 30px; width: 92%; left: 12px; }
  .wave:nth-child(3) { bottom: 48px; width: 64%; left: 36px; }
</style>
</head>
<body>
  <div class="frame">

    <div class="left">
      <div class="sun"></div>
      <div class="month-day">9月20日</div>
      <div class="weekday">星期日</div>
      <div class="weather">上海 · 晴<br>26°C · 微风</div>
      <div class="waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
      </div>
    </div>

    <div class="right">
      <div class="signature">—— 夜玄</div>
      <div class="letter">
        <div class="letter-title">✉ 晨安，无名</div>
        <div class="letter-body">
          九月走到三分之二了。<br>
          今天不用急着成为谁，<br>
          先好好喝一杯<em>冰咖啡</em>，<br>
          让身体先开口说话。
        </div>
      </div>
      <div class="practice">
        <div class="practice-tag">聚焦</div>
        <div class="practice-text">
          喝咖啡前，花十秒问问身体：「今天，你想被怎样对待？」——不用回答，听一听就好。
        </div>
      </div>
    </div>

  </div>
</body>
</html>
