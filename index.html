<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1">
<title>晨间窗</title>
<style>
  /* reTerminal E1002 · 800x480 · E Ink Spectra 6（只用六个纯色，无渐变无中间色） */
  :root {
    --ink-black: #1a1a1a;
    --ink-white: #f7f5ef;
    --ink-red:   #c0392b;
    --ink-yellow:#e6b800;
    --ink-blue:  #2e5f8a;
    --ink-green: #3d7a52;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 800px; height: 480px;
    overflow: hidden;
    background: var(--ink-white);
    color: var(--ink-black);
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-weight: 700;
  }
  .frame {
    width: 800px; height: 480px;
    border: 6px solid var(--ink-black);
    display: flex;
  }

  /* ================= 左栏：日期 / 天气 / 花 / 海浪 ================= */
  .left {
    width: 236px;
    border-right: 4px solid var(--ink-black);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 0 16px 0;
  }
  .sun { line-height: 0; }
  .month-day {
    font-size: 44px;
    letter-spacing: 1px;
    margin-top: 20px;
  }
  .weekday {
    font-size: 22px;
    color: var(--ink-blue);
    letter-spacing: 6px;
    margin-top: 6px;
  }
  .divider {
    width: 150px;
    border-top: 3px dashed var(--ink-black);
    margin: 18px 0;
  }
  .weather {
    font-size: 19px;
    color: var(--ink-green);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.7;
  }
  .flowers {
    margin-top: auto;
    line-height: 0;
    letter-spacing: 8px;
  }
  .waves { line-height: 0; margin-top: 10px; }

  /* ================= 右栏：信 / 卦 ================= */
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 30px;
  }

  /* 顶部一行：标题在左，卦在右，各占各的格子 */
  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .head-left { padding-top: 8px; }
  .head-title {
    font-size: 27px;
    color: var(--ink-red);
    letter-spacing: 4px;
  }
  .head-sub {
    font-size: 18px;
    color: var(--ink-black);
    letter-spacing: 2px;
    margin-top: 12px;
  }
  .gua {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .gua-name {
    font-size: 17px;
    color: var(--ink-red);
    letter-spacing: 4px;
    margin-top: 6px;
  }

  /* 信正文 */
  .letter {
    display: flex;
    align-items: center;
    flex: 1;
    gap: 14px;
  }
  .letter-body {
    flex: 1;
    font-size: 26px;
    line-height: 1.75;
    letter-spacing: 1px;
  }
  .letter-body em { font-style: normal; color: var(--ink-blue); }
  .cup { line-height: 0; }

  /* 底部：聚焦小练习 */
  .practice {
    border-top: 3px dashed var(--ink-black);
    padding-top: 13px;
    display: flex;
    align-items: center;
  }
  .practice-tag {
    background: var(--ink-green);
    color: var(--ink-white);
    font-size: 17px;
    letter-spacing: 3px;
    padding: 6px 13px;
    margin-right: 16px;
    white-space: nowrap;
  }
  .practice-text {
    font-size: 20px;
    line-height: 1.5;
  }
</style>
</head>
