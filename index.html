<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晨间窗</title>
<style>
  /* reTerminal E1002 · E Ink Spectra 6
     六色：黑#1a1a1a 白#f7f5ef 红#c0392b 黄#e6b800 蓝#2e5f8a 绿#3d7a52
     尺寸单位 --u = 框宽的1%（按框高钳制），随组件框等比缩放 */
  :root {
    --u: min(1vw, 1.6667vh);
    --ink-black:#1a1a1a; --ink-white:#f7f5ef; --ink-red:#c0392b;
    --ink-yellow:#e6b800; --ink-blue:#2e5f8a; --ink-green:#3d7a52;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:var(--ink-white); color:var(--ink-black);
    font-family:"Noto Serif SC","Songti SC","SimSun",serif; font-weight:700;
  }
  .frame { width:100%; height:100%; display:flex;
           border:calc(var(--u)*0.75) solid var(--ink-black); }

  /* ========== 左栏 ========== */
  .left {
    width:44%;
    border-right:calc(var(--u)*0.5) solid var(--ink-black);
    display:flex; flex-direction:column; align-items:center;
    padding:calc(var(--u)*0.9) calc(var(--u)*1.8) calc(var(--u)*1.2) calc(var(--u)*1.2);
  }
  .px-gua { width:calc(var(--u)*8); height:calc(var(--u)*9.6); flex:none; }

  .topline { display:flex; align-items:baseline; gap:calc(var(--u)*1.2); }
  .month-day { font-size:calc(var(--u)*4.6); line-height:1.1; }
  .weekday { font-size:calc(var(--u)*2.2); color:var(--ink-blue);
             letter-spacing:calc(var(--u)*0.5); }
  .weather { font-size:calc(var(--u)*2.0); color:var(--ink-green);
             letter-spacing:calc(var(--u)*0.15); margin-top:calc(var(--u)*0.5); }
  .divider { width:88%; border-top:calc(var(--u)*0.32) dashed var(--ink-black);
             margin:calc(var(--u)*1.0) 0 calc(var(--u)*0.9) 0; }

  .gua { width:100%; display:flex; flex-direction:column; align-items:center; }
  .gua-title { font-size:calc(var(--u)*3.2); color:var(--ink-red);
               letter-spacing:calc(var(--u)*0.6); line-height:1.2; }
  .gua-shape { display:flex; align-items:center; gap:calc(var(--u)*1.2);
               margin-top:calc(var(--u)*0.7); }
  .gua-trigrams { font-size:calc(var(--u)*1.9); color:var(--ink-blue);
                  letter-spacing:calc(var(--u)*0.12); line-height:1.35; }
  .gua-text { font-size:calc(var(--u)*1.85); line-height:1.5; color:var(--ink-black);
              margin-top:calc(var(--u)*0.8); width:100%; }
  .gua-text .lbl { color:var(--ink-red); }

  /* 画：占满剩下的所有空间 */
  .pic { flex:1; min-height:0; width:100%; display:flex; align-items:center;
         justify-content:center; margin-top:calc(var(--u)*0.9); }
  .pic img { max-width:100%; max-height:100%; width:100%; height:auto;
             object-fit:contain; display:block; }

  /* ========== 右栏 ========== */
  .right { flex:1; display:flex; flex-direction:column;
           padding:calc(var(--u)*1.6) calc(var(--u)*3.0) calc(var(--u)*1.8) calc(var(--u)*3.0); }
  .head-title { font-size:calc(var(--u)*3.4); color:var(--ink-red);
                letter-spacing:calc(var(--u)*0.5); }
  .head-sub   { font-size:calc(var(--u)*2.0); letter-spacing:calc(var(--u)*0.2);
                margin-top:calc(var(--u)*0.8); }
  .quote { flex:1; display:flex; flex-direction:column; justify-content:center;
           font-size:calc(var(--u)*2.7); line-height:1.8; letter-spacing:1px; }
  .quote-src { font-size:calc(var(--u)*2.0); color:var(--ink-blue);
               margin-top:calc(var(--u)*1.3); letter-spacing:calc(var(--u)*0.25); }

  .practice { border-top:calc(var(--u)*0.32) dashed var(--ink-black);
              padding-top:calc(var(--u)*1.1); display:flex; align-items:center; }
  .practice-tag { background:var(--ink-green); color:var(--ink-white);
                  font-size:calc(var(--u)*1.9); letter-spacing:calc(var(--u)*0.3);
                  padding:calc(var(--u)*0.5) calc(var(--u)*1.1);
                  margin-right:calc(var(--u)*1.3); white-space:nowrap; }
  .practice-text { font-size:calc(var(--u)*2.25); line-height:1.5; }
</style>
</head>
<body>
  <div class="frame">

    <div class="left">
      <div class="topline">
        <div class="month-day">9月20日</div>
        <div class="weekday">星期日</div>
      </div>
      <div class="weather">上海 · 晴 · 26°C</div>
      <div class="divider"></div>

      <div class="gua">
        <div class="gua-title">山天大畜</div>
        <div class="gua-shape">
          <svg class="px-gua" viewBox="0 0 11 12.55" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0.0" width="11" height="1.3" fill="#1a1a1a"/><rect x="0" y="2.2" width="4.2" height="1.3" fill="#1a1a1a"/><rect x="6.8" y="2.2" width="4.2" height="1.3" fill="#1a1a1a"/><rect x="0" y="4.5" width="4.2" height="1.3" fill="#1a1a1a"/><rect x="6.8" y="4.5" width="4.2" height="1.3" fill="#1a1a1a"/><rect x="0" y="6.8" width="11" height="1.3" fill="#1a1a1a"/><rect x="0" y="9.0" width="11" height="1.3" fill="#1a1a1a"/><rect x="0" y="11.2" width="11" height="1.3" fill="#1a1a1a"/></svg>
          <div class="gua-trigrams">艮上 乾下<br>第二十六卦</div>
        </div>
        <div class="gua-text">
          <span class="lbl">卦辞</span>　利贞。不家食，吉。利涉大川。<br>
          <span class="lbl">象曰</span>　天在山中，大畜。<br>
          <span class="lbl">藏</span>　　「陽氣內藏」——慢慢蓄，不必急。
        </div>
      </div>

      <div class="head-title">晨安</div>
      <div class="head-sub">今日 · 宜慢慢来</div>

      <div class="quote">
        「真实的东西，本来就已经在那里了。<br>
        承认它，不会让它变得更糟；<br>
        不面对它，它也不会消失。<br>
        正因为它真实，它才是可以与你互动的东西。」
        <div class="quote-src">—— 简德林《聚焦》</div>
      </div>

      <div class="practice">
        <div class="practice-tag">聚焦</div>
        <div class="practice-text">喝咖啡前，花十秒问问身体：「今天，你想被怎样对待？」不用回答，听一听就好。</div>
